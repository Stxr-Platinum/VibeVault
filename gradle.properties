org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.enableJetifier=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=true
android.nonTransitiveRClass=true
android.enableIncrementalDesugaring=true
android.enableDexingArtifactTransform=true
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
dagger.hilt.disableCrossCompilationRootValidation=true
dagger.hilt.disableCrossProjectSubprojectCheck=true

# Incremental compilation speedups
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseG1GC
kotlin.parallel.tasks.in.project=true
ksp.incremental=true
ksp.incremental.interprocessor=true
ksp.useClasspathSnapshot=true
ksp.run.in.process=true
android.newDsl=false